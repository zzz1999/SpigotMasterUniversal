name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: latest-release
  cancel-in-progress: false

jobs:
  build:
    name: Spigot API ${{ matrix.api }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [1.12.2-R0.1-SNAPSHOT, 1.18.2-R0.1-SNAPSHOT]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build from source and run compatibility tests
        run: mvn -B -ntp -Dspigot-api.version=${{ matrix.api }} clean verify
      - name: Verify the distribution
        run: python3 scripts/verify_artifact.py
      - name: Store the release artifact
        if: matrix.api == '1.12.2-R0.1-SNAPSHOT'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-jar
          path: target/SpigotMasterUniversal-*.jar
          if-no-files-found: error

  release:
    name: Publish the latest release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-jar
          path: release-assets
      - name: Publish and remove older releases
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const { owner, repo } = context.repo;
            const branch = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            if (branch.data.commit.sha !== context.sha) {
              core.notice('A newer main commit exists; skipping this older build.');
              return;
            }
            const version = fs.readFileSync('pom.xml', 'utf8').match(/<version>([^<]+)<\/version>/)[1];
            const filename = `SpigotMasterUniversal-${version}.jar`;
            const data = fs.readFileSync(`release-assets/${filename}`);
            const digest = crypto.createHash('sha256').update(data).digest('hex');
            const body = [
              `Built from commit ${context.sha}.`,
              '',
              'Compiled from the restored sources with Java 8 bytecode.',
              'Build and regression tests passed against Spigot 1.12.2 and 1.18.2 APIs.',
              'Requires the NBTAPI plugin. In-game acceptance is still required.',
              '',
              `SHA-256: \`${digest}\``,
            ].join('\n');
            const existingReleases = await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 });
            let release = existingReleases.find(candidate => candidate.tag_name === version);
            if (!release) {
              release = (await github.rest.repos.createRelease({
                owner, repo, tag_name: version, target_commitish: context.sha,
                name: version, body, draft: true, prerelease: false,
              })).data;
            }
            const temporaryName = `${filename}.${context.runId}.${process.env.GITHUB_RUN_ATTEMPT || '1'}`;
            const uploaded = (await github.rest.repos.uploadReleaseAsset({
              owner, repo, release_id: release.id, name: temporaryName, data,
              headers: { 'content-type': 'application/java-archive', 'content-length': data.length },
            })).data;
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner, repo, release_id: release.id, per_page: 100,
            });
            for (const asset of assets) {
              if (asset.id !== uploaded.id && (asset.name === filename || asset.name.startsWith(`${filename}.`))) {
                await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: asset.id });
              }
            }
            await github.rest.repos.updateReleaseAsset({ owner, repo, asset_id: uploaded.id, name: filename });
            const ref = `tags/${version}`;
            try {
              const currentTag = (await github.rest.git.getRef({ owner, repo, ref })).data;
              if (currentTag.object.sha !== context.sha) {
                await github.rest.git.updateRef({ owner, repo, ref, sha: context.sha, force: true });
              }
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({ owner, repo, ref: `refs/${ref}`, sha: context.sha });
            }
            await github.rest.repos.updateRelease({
              owner, repo, release_id: release.id, name: version, body,
              draft: false, prerelease: false, make_latest: 'true',
            });
            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 });
            for (const previous of releases) {
              if (previous.id !== release.id) {
                await github.rest.repos.deleteRelease({ owner, repo, release_id: previous.id });
              }
            }
            core.notice(`Published ${release.html_url}`);
